name: Deploy game to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Disable dev mode
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          file = Path(os.environ["GITHUB_WORKSPACE"]) / "config.ts"

          print(f"Editing: {file}")

          content = file.read_text()

          old = "const DEV_MODE = true"
          new = "const DEV_MODE = false"

          if old not in content:
              raise RuntimeError("DEV_MODE declaration not found")

          file.write_text(content.replace(old, new))
          PY

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: install makecode cli
        run: npm install -g makecode

      # -j = browser (JavaScript) build, --always-built = write to built/ not built/<hw>/
      - name: build game
        run: mkc build --java-script --always-built

      # index.html loads ./assets/js/binary.js - replace the stale committed copy
      - name: copy fresh binary
        run: cp built/binary.js assets/js/binary.js

      - uses: actions/configure-pages@v5

      - name: build site (jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
