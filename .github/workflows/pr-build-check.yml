name: PR Build Check

on:
  pull_request:
    branches: [master]

jobs:
  # the job id is the check name GitHub shows (and what the master ruleset requires)
  pr-build-check:
    name: pr-build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Disable dev mode
        run: |
          if grep -q "const DEV_MODE = true" config.ts; then
            sed -i 's/const DEV_MODE = true/const DEV_MODE = false/' config.ts
            echo "DEV_MODE set to false"
          else
            echo "::warning::DEV_MODE = true not found in config.ts - nothing to disable"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: install makecode cli
        run: npm install -g makecode

      - name: build game
        run: mkc build --java-script --always-built

      # ---- runtime checks: things that compile fine but crash when the game runs ----

      # every getImage("name") / hero sprite name must exist in images.g.jres
      - name: check image names
        run: node .github/scripts/check-images.js

      # open the built game in headless Chrome, play ~25s, fail on a crash in the console
      - name: install playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: smoke test (play the built game)
        run: |
          cp built/binary.js assets/js/binary.js
          python3 -m http.server 8000 > /dev/null 2>&1 &
          sleep 2
          node .github/scripts/smoke-test.mjs

      - name: upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot
          path: smoke-test.png
          if-no-files-found: ignore
